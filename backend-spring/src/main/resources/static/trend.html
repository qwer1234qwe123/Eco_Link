<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>적재율 추이 | EcoLink BinGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  <style>
    :root { --accent: #2ea86a; }

    /* ── 추이 카드 그리드 ── */
    .trend-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    .trend-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: fadeInUp 0.4s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .trend-card:nth-child(1) { animation-delay: 0.05s; }
    .trend-card:nth-child(2) { animation-delay: 0.10s; }
    .trend-card:nth-child(3) { animation-delay: 0.15s; }
    .trend-card:nth-child(4) { animation-delay: 0.20s; }
    .trend-card:nth-child(5) { animation-delay: 0.25s; }
    .trend-card:nth-child(6) { animation-delay: 0.30s; }

    /* ── 카드 상단 ── */
    .trend-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .trend-card-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .trend-card-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-top: 4px;
    }

    .trend-status-badge {
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-danger { background: rgba(239,68,68,0.15); color: #ef4444; }
    .badge-warn   { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .badge-safe   { background: rgba(46,168,106,0.15); color: #2ea86a; }

    /* ── 적재율 바 ── */
    .trend-fill-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .trend-fill-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    .trend-fill-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 14px;
    }

    .trend-fill-bg {
      height: 10px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      overflow: hidden;
    }

    .trend-fill-bar {
      height: 100%;
      border-radius: 100px;
      transition: width 0.8s ease;
    }

    /* ── AI 예측 정보 ── */
    .trend-pred-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .trend-pred-title {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .trend-pred-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .trend-pred-label { color: var(--text-muted); }

    .trend-pred-value {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--text);
    }

    .trend-pred-value.danger { color: #ef4444; }
    .trend-pred-value.warn   { color: #f59e0b; }
    .trend-pred-value.safe   { color: #2ea86a; }

    /* ── 미니 그래프 ── */
    .trend-mini-chart {
      height: 60px;
      position: relative;
      overflow: hidden;
    }

    .trend-mini-chart canvas {
      width: 100% !important;
      height: 60px !important;
    }

    /* ── 빈 상태 ── */
    .trend-empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .trend-empty-icon { font-size: 48px; margin-bottom: 16px; }

    /* ── 상단 요약 ── */
    .trend-summary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .trend-summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .trend-summary-label { font-size: 12px; color: var(--text-muted); }

    .trend-summary-value {
      font-size: 28px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text);
    }

    .trend-summary-desc { font-size: 12px; color: var(--text-muted); }

    .btn-refresh-trend {
      padding: 8px 20px;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-refresh-trend:hover { opacity: 0.85; }

    .last-trend-time {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    @media (max-width: 768px) {
      .trend-summary-row { grid-template-columns: 1fr; }
      .trend-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <aside>
    <div class="sidebar-logo">
      <h1>Bin<span>Go</span></h1>
      <small>by EcoLink — 관리자 대시보드</small>
    </div>
    <button class="dash-hamburger" id="dashHamburger" aria-label="메뉴" style="display:none">
      <span></span><span></span><span></span>
    </button>
    <nav class="side-nav">
      <div class="nav-group-label">모니터링</div>
      <a class="nav-item" href="/dashboard">
        <span class="icon">📊</span> 대시보드
      </a>
      <a class="nav-item" href="#">
        <span class="icon">🗑️</span> 쓰레기통 목록
      </a>
      <a class="nav-item" href="#">
        <span class="icon">📡</span> 센서 로그
      </a>
      <div class="nav-group-label">AI / 예측</div>
      <a class="nav-item" href="/prediction">
        <span class="icon">🤖</span> 예측 결과
      </a>
      <a class="nav-item active" href="/trend">
        <span class="icon">📈</span> 적재율 추이
      </a>
      <div class="nav-group-label">수거 관리</div>
      <a class="nav-item" href="/route">
        <span class="icon">🗺️</span> 수거 경로
      </a>
      <a class="nav-item" href="#">
        <span class="icon">📋</span> 수거 기록
      </a>
      <a class="nav-item" href="#">
        <span class="icon">👷</span> 작업자 관리
      </a>
    </nav>
    <div class="sidebar-footer">
      <a href="/">← 소개 페이지로</a>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="topbar-left">
        <h2>적재율 추이 <span class="live-badge"><span class="live-dot"></span>LIVE</span></h2>
        <p>쓰레기통별 현재 적재율 및 포화 예상 시각</p>
      </div>
      <div class="topbar-right">
        <span class="time" id="clock">--:--:--</span>
        <button class="btn-refresh-trend" onclick="loadTrend()">↻ 새로고침</button>
      </div>
    </div>

    <div class="content">

      <!-- 요약 카드 -->
      <div class="trend-summary-row">
        <div class="trend-summary-card">
          <div class="trend-summary-label">📊 전체 평균 적재율</div>
          <div class="trend-summary-value" id="sum-avg">—</div>
          <div class="trend-summary-desc">전체 쓰레기통 기준</div>
        </div>
        <div class="trend-summary-card">
          <div class="trend-summary-label">⏱ 가장 빠른 포화 예상</div>
          <div class="trend-summary-value" id="sum-fastest">—</div>
          <div class="trend-summary-desc">시간 후 포화 예상</div>
        </div>
        <div class="trend-summary-card">
          <div class="trend-summary-label">🔴 위험 쓰레기통</div>
          <div class="trend-summary-value" id="sum-danger">—</div>
          <div class="trend-summary-desc">3시간 이내 포화 예상</div>
        </div>
      </div>

      <!-- 마지막 업데이트 시간 -->
      <div style="display:flex;justify-content:flex-end;margin-bottom:16px">
        <span class="last-trend-time" id="last-trend-time">업데이트 중...</span>
      </div>

      <!-- 추이 카드 그리드 -->
      <div class="trend-grid" id="trend-grid">
        <div class="trend-empty">
          <div class="trend-empty-icon">📈</div>
          <div>데이터를 불러오는 중입니다...</div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // ── 시계 ──
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent =
        now.toLocaleTimeString('ko-KR', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── 적재율 색상 ──
    function getFillColor(v) {
      if (v >= 80) return '#ef4444';
      if (v >= 60) return '#f59e0b';
      return '#2ea86a';
    }

    function getBadgeClass(hours) {
      if (hours === null || hours === undefined) return 'badge-safe';
      if (hours <= 3) return 'badge-danger';
      if (hours <= 6) return 'badge-warn';
      return 'badge-safe';
    }

    function getBadgeText(hours) {
      if (hours === null || hours === undefined) return '🟢 정상';
      if (hours <= 3) return '🔴 위험';
      if (hours <= 6) return '🟡 주의';
      return '🟢 정상';
    }

    function getValueClass(hours) {
      if (hours === null || hours === undefined) return 'safe';
      if (hours <= 3) return 'danger';
      if (hours <= 6) return 'warn';
      return 'safe';
    }

    // ── 카드 렌더링 ──
    function renderTrendCards(data) {
      const grid = document.getElementById('trend-grid');

      if (!data || data.length === 0) {
        grid.innerHTML = `
          <div class="trend-empty">
            <div class="trend-empty-icon">📈</div>
            <div>데이터가 없습니다.</div>
          </div>`;
        return;
      }

      // 포화 임박 순으로 정렬
      const sorted = [...data].sort((a, b) => {
        const aH = a.hours_until_full ?? 999;
        const bH = b.hours_until_full ?? 999;
        return aH - bH;
      });

      grid.innerHTML = sorted.map((item, i) => `
        <div class="trend-card" style="animation-delay:${i * 0.05}s">
          <div class="trend-card-top">
            <div>
              <div class="trend-card-id">CAN #${item.canId}</div>
              <div class="trend-card-name">${item.locName}</div>
            </div>
            <span class="trend-status-badge ${getBadgeClass(item.hours_until_full)}">
              ${getBadgeText(item.hours_until_full)}
            </span>
          </div>

          <div class="trend-fill-wrap">
            <div class="trend-fill-label">
              <span>현재 적재율</span>
              <span class="trend-fill-val" style="color:${getFillColor(item.fillLevel)}">${item.fillLevel}%</span>
            </div>
            <div class="trend-fill-bg">
              <div class="trend-fill-bar" style="width:${item.fillLevel}%;background:${getFillColor(item.fillLevel)}"></div>
            </div>
          </div>

          <div class="trend-pred-box">
            <div class="trend-pred-title">🤖 AI 포화 예측</div>
            <div class="trend-pred-row">
              <span class="trend-pred-label">포화까지 남은 시간</span>
              <span class="trend-pred-value ${getValueClass(item.hours_until_full)}">
                ${item.hours_until_full !== null && item.hours_until_full !== undefined
                  ? `약 ${item.hours_until_full}시간`
                  : '데이터 없음'}
              </span>
            </div>
            <div class="trend-pred-row">
              <span class="trend-pred-label">예상 포화 시각</span>
              <span class="trend-pred-value ${getValueClass(item.hours_until_full)}">
                ${item.predicted_full_time || '—'}
              </span>
            </div>
            <div class="trend-pred-row">
              <span class="trend-pred-label">배터리</span>
              <span class="trend-pred-value">${item.battery}%</span>
            </div>
          </div>
        </div>
      `).join('');

      // 요약 카드 업데이트
      const avgFill = Math.round(data.reduce((s, d) => s + d.fillLevel, 0) / data.length);
      const validHours = data
        .map(d => d.hours_until_full)
        .filter(h => h !== null && h !== undefined);
      const fastest = validHours.length > 0 ? Math.min(...validHours) : null;
      const dangerCount = validHours.filter(h => h <= 3).length;

      document.getElementById('sum-avg').textContent = avgFill + '%';
      document.getElementById('sum-fastest').textContent = fastest !== null ? fastest + '시간' : '—';
      document.getElementById('sum-danger').textContent = dangerCount + '개';
    }

    // ── 데이터 로드 ──
    async function loadTrend() {
      document.getElementById('last-trend-time').textContent = '업데이트 중...';

      try {
        // 1. 쓰레기통 목록
        const canRes = await fetch('/api/trashcan');
        const cans = await canRes.json();

        // 2. 각 쓰레기통 최신 센서값 + AI 예측
        const trendData = await Promise.all(
          cans.map(async (can) => {
            // 최신 센서값
            let fillLevel = 0;
            let battery = 0;
            try {
              const sensorRes = await fetch(`/api/sensor/${can.id}`);
              const logs = await sensorRes.json();
              const latest = logs.length > 0 ? logs[logs.length - 1] : null;
              fillLevel = latest ? latest.fillLevel : 0;
              battery = latest ? latest.batteryLevel : 0;
            } catch {}

            // AI 회귀 예측
            let hours_until_full = null;
            let predicted_full_time = null;
            try {
              const predRes = await fetch(`/api/prediction/${can.id}`);
              const pred = await predRes.json();
              hours_until_full = pred.hours_until_full ?? null;
              predicted_full_time = pred.predicted_full_time ?? null;
            } catch {}

            return {
              canId: can.id,
              locName: can.locName,
              fillLevel: Math.round(fillLevel),
              battery: Math.round(battery),
              hours_until_full,
              predicted_full_time
            };
          })
        );

        renderTrendCards(trendData);

      } catch (err) {
        console.error('데이터 로드 실패:', err);
        document.getElementById('trend-grid').innerHTML = `
          <div class="trend-empty">
            <div class="trend-empty-icon">⚠️</div>
            <div>서버 연결에 실패했습니다.<br>잠시 후 다시 시도해 주세요.</div>
          </div>`;
      }

      document.getElementById('last-trend-time').textContent =
        new Date().toLocaleTimeString('ko-KR') + ' 업데이트';
    }

    loadTrend();
    setInterval(loadTrend, 30000);

    // ── 모바일 햄버거 ──
    const dashHamburger = document.getElementById('dashHamburger');
    const sideNav = document.querySelector('nav.side-nav');

    function initMobileNav() {
      if (window.innerWidth <= 768) {
        dashHamburger.style.display = 'flex';
      } else {
        dashHamburger.style.display = 'none';
        sideNav.classList.remove('open');
        dashHamburger.classList.remove('open');
      }
    }

    dashHamburger.addEventListener('click', () => {
      dashHamburger.classList.toggle('open');
      sideNav.classList.toggle('open');
    });

    initMobileNav();
    window.addEventListener('resize', initMobileNav);
  </script>
</body>
</html>
