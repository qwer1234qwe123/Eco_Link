<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BinGo — 로그인 | EcoLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: rgba(255,255,255,0.07);
      --green: #2ea86a;
      --green-light: #3ecf8e;
      --green-neon: #4dffa0;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --red: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* 배경 그라데이션 */
    .bg-glow {
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(46,168,106,0.08) 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 20px;
    }

    /* 로고 */
    .login-logo {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -1px;
    }

    .login-logo h1 span { color: var(--green-light); }

    .login-logo p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* 카드 */
    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
    }

    .login-card h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .login-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .form-input {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Noto Sans KR', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .form-input:focus { border-color: var(--green); }
    .form-input::placeholder { color: rgba(255,255,255,0.2); }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn-login:hover { background: var(--green-light); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 에러 메시지 */
    .error-msg {
      display: none;
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 16px;
      text-align: center;
    }

    .error-msg.show { display: block; }

    /* 로딩 스피너 */
    .spinner-sm {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* 등급 안내 */
    .grade-info {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .grade-badge {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .grade-badge .grade-name {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .grade-badge .grade-desc {
      font-size: 10px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .grade-admin .grade-name { color: #3b82f6; }
    .grade-worker .grade-name { color: var(--green-light); }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <div class="login-wrap">
    <div class="login-logo">
      <h1>Bin<span>Go</span></h1>
      <p>EcoLink AI 기반 스마트 폐기물 수거 시스템</p>
    </div>

    <div class="login-card">
      <h2>관리자 로그인</h2>
      <p>등록된 계정으로 로그인해 주세요.</p>

      <div class="error-msg" id="error-msg">아이디 또는 비밀번호가 틀렸습니다.</div>

      <div class="form-group">
        <label class="form-label">아이디</label>
        <input type="text" class="form-input" id="username" placeholder="아이디 입력" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input type="password" class="form-input" id="password" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>

      <button class="btn-login" id="login-btn" onclick="doLogin()">로그인</button>

      <div class="grade-info">
        <div class="grade-badge grade-admin">
          <div class="grade-name">관리자 (grade 1)</div>
          <div class="grade-desc">전체 기능 접근 가능</div>
        </div>
        <div class="grade-badge grade-worker">
          <div class="grade-name">작업자 (grade 5)</div>
          <div class="grade-desc">대시보드 · 경로 · 기록 조회 가능</div>
        </div>
      </div>
    </div>

    <div style="text-align:center;margin-top:16px;">
      <a href="/bingo/" style="font-size:13px;color:var(--text-muted);text-decoration:none;">← 소개 페이지로</a>
    </div>
    <div class="login-footer">
      © 2026 EcoLink Team — 융합프로젝트
    </div>
  </div>

  <script>
    // 이미 로그인된 경우 대시보드로
    fetch('/bingo/api/auth/me', { credentials: 'include' })
      .then(res => {
        if (res.ok) window.location.href = '/bingo/dashboard';
      })
      .catch(() => {});

    // Enter 키 로그인
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const btn = document.getElementById('login-btn');
      const errMsg = document.getElementById('error-msg');

      if (!username || !password) {
        errMsg.textContent = '아이디와 비밀번호를 입력해주세요.';
        errMsg.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-sm"></span> 로그인 중...';
      errMsg.classList.remove('show');

      try {
        const res = await fetch('/bingo/api/auth/login', { credentials: 'include',
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (res.ok) {
          window.location.href = '/bingo/dashboard';
        } else {
          const data = await res.json();
          errMsg.textContent = data.message || '로그인에 실패했습니다.';
          errMsg.classList.add('show');
        }
      } catch {
        errMsg.textContent = '서버 연결에 실패했습니다.';
        errMsg.classList.add('show');
      }

      btn.disabled = false;
      btn.innerHTML = '로그인';
    }
  </script>
</body>
</html>
