<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수거 기록 | EcoLink BinGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  
  <style>
    :root { --accent: #2ea86a; }

    .history-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    .history-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-refresh-history {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: background 0.2s;
    }
    .btn-refresh-history:hover { background: var(--green-light); }

    .last-history-time {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* 쓰레기통 섹션 그리드 */
    .can-sections {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .can-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      animation: fadeInUp 0.4s ease both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .can-section:nth-child(1) { animation-delay: 0.05s; }
    .can-section:nth-child(2) { animation-delay: 0.10s; }
    .can-section:nth-child(3) { animation-delay: 0.15s; }
    .can-section:nth-child(4) { animation-delay: 0.20s; }
    .can-section:nth-child(5) { animation-delay: 0.25s; }
    .can-section:nth-child(6) { animation-delay: 0.30s; }

    .can-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    .can-section-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .can-section-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(46,168,106,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }

    .can-section-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    .can-section-name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-top: 2px;
    }

    .history-count-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      font-size: 11px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* 로그 테이블 */
    .log-table-wrap {
      max-height: 280px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .log-table {
      width: 100%;
      border-collapse: collapse;
    }

    .log-table th {
      text-align: left;
      padding: 8px 20px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--card);
      z-index: 1;
    }

    .log-table td {
      padding: 10px 20px;
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .log-table tr:last-child td { border-bottom: none; }
    .log-table tr:hover td { background: rgba(255,255,255,0.02); }

    .level-change {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .level-before { color: #ef4444; font-weight: 600; }
    .level-arrow  { color: var(--text-dim); }
    .level-after  { color: #2ea86a; font-weight: 600; }

    .log-time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
    }

    .note-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 10px;
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
    }

    .no-data {
      padding: 32px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
    }

    @media (max-width: 1100px) {
      .can-sections { grid-template-columns: 1fr; }
      .history-stats { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .history-stats { grid-template-columns: repeat(2, 1fr); }
      .can-sections { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <script>
    // ── 권한 체크 (페이지 로드 즉시) ──
    (function() {
      var page = window.location.pathname;
      var restricted = ['/worker', '/trashcan'];

      fetch('/api/auth/me')
        .then(function(res) {
          if (!res.ok) {
            window.location.replace('/login');
            return null;
          }
          return res.json();
        })
        .then(function(user) {
          if (!user) return;

          // grade 5가 제한 페이지 직접 접근 시 차단
          if (user.grade === 5 && restricted.includes(page)) {
            alert('접근 권한이 없습니다.');
            window.location.replace('/dashboard');
            return;
          }

          // 사용자 정보 표시
          var logo = document.querySelector('.sidebar-logo small');
          if (logo) {
            logo.textContent = user.username + ' (' + (user.grade === 1 ? '관리자' : '작업자') + ')';
          }

          // 로그아웃 버튼 표시
          var logoutBtn = document.getElementById('logout-btn');
          if (logoutBtn) logoutBtn.style.display = 'block';

          // grade 5: 제한 메뉴 클릭 시 알럿만
          if (user.grade === 5) {
            document.querySelectorAll('a[href="/worker"], a[href="/trashcan"]').forEach(function(el) {
              el.addEventListener('click', function(e) {
                e.preventDefault();
                alert('접근 권한이 없습니다.');
              });
            });
          }
        })
        .catch(function() {
          window.location.replace('/login');
        });
    })();
  </script>

  <aside>
    <div class="sidebar-logo">
      <h1>Bin<span>Go</span></h1>
      <small>by EcoLink — 관리자 대시보드</small>
    </div>
    <button class="dash-hamburger" id="dashHamburger" aria-label="메뉴" style="display:none">
      <span></span><span></span><span></span>
    </button>
    <nav class="side-nav">
      <div class="nav-group-label">모니터링</div>
      <a class="nav-item" href="/dashboard"><span class="icon"><i data-lucide="layout-dashboard"></i></span> 대시보드</a>
      <a class="nav-item" href="/trashcan"><span class="icon"><i data-lucide="trash-2"></i></span> 쓰레기통 목록</a>
      <a class="nav-item" href="/sensor-log"><span class="icon"><i data-lucide="radio"></i></span> 센서 로그</a>
      <div class="nav-group-label">AI / 예측</div>
      <a class="nav-item" href="/prediction"><span class="icon"><i data-lucide="bot"></i></span> 예측 결과</a>
      <a class="nav-item" href="/trend"><span class="icon"><i data-lucide="trending-up"></i></span> 적재율 추이</a>
      <div class="nav-group-label">수거 관리</div>
      <a class="nav-item" href="/route"><span class="icon"><i data-lucide="map"></i></span> 수거 경로</a>
      <a class="nav-item active" href="/collection-history"><span class="icon"><i data-lucide="clipboard-list"></i></span> 수거 기록</a>
      <a class="nav-item" href="/worker"><span class="icon"><i data-lucide="hard-hat"></i></span> 작업자 관리</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/">← 소개 페이지로</a>
      <a id="logout-btn" href="#" onclick="logout()" style="display:none;margin-top:8px;color:#ef4444;font-size:13px;text-decoration:none;">로그아웃</a>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="topbar-left">
        <h2>수거 기록</h2>
        <p>쓰레기통별 비움 이력 기록</p>
      </div>
      <div class="topbar-right">
        <span class="time" id="clock">--:--:--</span>
        <button class="btn-refresh-history" onclick="loadHistory()">
          <i data-lucide="refresh-cw" style="width:14px;height:14px"></i>
          새로고침
        </button>
      </div>
    </div>

    <div class="content">

      <!-- 요약 카드 -->
      <div class="history-stats">
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">전체 수거 횟수</span>
            <span class="stat-card-icon"><i data-lucide="check-circle"></i></span>
          </div>
          <div class="stat-card-value v-green" id="stat-total">—</div>
          <div class="stat-card-sub">누적 비움 기록</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">오늘 수거</span>
            <span class="stat-card-icon"><i data-lucide="calendar"></i></span>
          </div>
          <div class="stat-card-value v-blue" id="stat-today">—</div>
          <div class="stat-card-sub">오늘 비움 횟수</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">평균 수거 전 적재율</span>
            <span class="stat-card-icon"><i data-lucide="bar-chart-2"></i></span>
          </div>
          <div class="stat-card-value v-yellow" id="stat-avg-before">—</div>
          <div class="stat-card-sub">비움 직전 평균</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">센서 자동 감지</span>
            <span class="stat-card-icon"><i data-lucide="zap"></i></span>
          </div>
          <div class="stat-card-value v-green" id="stat-auto">—</div>
          <div class="stat-card-sub">자동 감지 건수</div>
        </div>
      </div>

      <!-- 업데이트 시간 -->
      <div class="history-toolbar">
        <span class="last-history-time" id="last-history-time">업데이트 중...</span>
      </div>

      <!-- 쓰레기통별 섹션 -->
      <div class="can-sections" id="can-sections">
        <div class="loading"><div class="spinner"></div> 데이터 불러오는 중...</div>
      </div>

    </div>
  </main>

  <script>
    function updateClock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('ko-KR', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function formatTime(dateStr) {
      if (!dateStr) return '—';
      return new Date(dateStr).toLocaleString('ko-KR', {
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      });
    }

    function renderSections(cans, historyByCan) {
      const container = document.getElementById('can-sections');

      let totalCount = 0;
      let todayCount = 0;
      let beforeLevels = [];
      let autoCount = 0;
      const today = new Date().toDateString();

      container.innerHTML = cans.map((can, i) => {
        const records = historyByCan[can.id] || [];

        totalCount += records.length;
        records.forEach(r => {
          if (new Date(r.emptiedAt).toDateString() === today) todayCount++;
          if (r.beforeLevel != null) beforeLevels.push(r.beforeLevel);
          if (r.note && r.note.includes('자동')) autoCount++;
        });

        return `
          <div class="can-section" style="animation-delay:${i * 0.05}s">
            <div class="can-section-header">
              <div class="can-section-left">
                <div class="can-section-icon">
                  <i data-lucide="trash-2" style="width:16px;height:16px"></i>
                </div>
                <div>
                  <div class="can-section-id">CAN #${can.id}</div>
                  <div class="can-section-name">${can.locName}</div>
                </div>
              </div>
              <span class="history-count-badge">${records.length}건</span>
            </div>
            <div class="log-table-wrap">
              ${records.length === 0
                ? `<div class="no-data">수거 기록이 없습니다.</div>`
                : `<table class="log-table">
                    <thead>
                      <tr>
                        <th>적재율 변화</th>
                        <th>비움 시각</th>
                        <th>비고</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${records.map(r => `
                        <tr>
                          <td>
                            <div class="level-change">
                              <span class="level-before">${r.beforeLevel ?? '—'}%</span>
                              <span class="level-arrow">→</span>
                              <span class="level-after">${r.afterLevel ?? '—'}%</span>
                            </div>
                          </td>
                          <td class="log-time">${formatTime(r.emptiedAt)}</td>
                          <td><span class="note-badge">${r.note || '—'}</span></td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>`
              }
            </div>
          </div>
        `;
      }).join('');

      // 통계 업데이트
      document.getElementById('stat-total').textContent = totalCount;
      document.getElementById('stat-today').textContent = todayCount;
      document.getElementById('stat-avg-before').textContent =
        beforeLevels.length > 0
          ? Math.round(beforeLevels.reduce((a, b) => a + b, 0) / beforeLevels.length) + '%'
          : '—';
      document.getElementById('stat-auto').textContent = autoCount;

      lucide.createIcons();
    }

    async function loadHistory() {
      document.getElementById('last-history-time').textContent = '업데이트 중...';

      try {
        // 쓰레기통 목록
        const canRes = await fetch('/api/trashcan');
        const cans = await canRes.json();

        // 쓰레기통별 비움 기록 조회
        const historyByCan = {};
        await Promise.all(
          cans.map(async (can) => {
            try {
              const res = await fetch(`/api/empty-history/can/${can.id}`);
              const records = res.ok ? await res.json() : [];
              // 최신순 정렬
              historyByCan[can.id] = records.sort((a, b) =>
                new Date(b.emptiedAt) - new Date(a.emptiedAt)
              );
            } catch {
              historyByCan[can.id] = [];
            }
          })
        );

        renderSections(cans, historyByCan);

      } catch (err) {
        console.error('데이터 로드 실패:', err);
        document.getElementById('can-sections').innerHTML =
          `<div class="loading">서버 연결에 실패했습니다.</div>`;
      }

      document.getElementById('last-history-time').textContent =
        new Date().toLocaleTimeString('ko-KR') + ' 업데이트';
    }

    // 모바일 햄버거
    const dashHamburger = document.getElementById('dashHamburger');
    const sideNav = document.querySelector('nav.side-nav');
    function initMobileNav() {
      if (window.innerWidth <= 768) { dashHamburger.style.display = 'flex'; }
      else { dashHamburger.style.display = 'none'; sideNav.classList.remove('open'); dashHamburger.classList.remove('open'); }
    }
    dashHamburger.addEventListener('click', () => { dashHamburger.classList.toggle('open'); sideNav.classList.toggle('open'); });
    initMobileNav();
    window.addEventListener('resize', initMobileNav);

    loadHistory();
    setInterval(loadHistory, 30000);
  </script>
  <script>
    (function() {
      var script = document.createElement('script');
      script.src = 'https://unpkg.com/lucide@latest/dist/umd/lucide.min.js';
      script.onload = function() { lucide.createIcons(); };
      document.head.appendChild(script);
    })();
  </script>
  <script>
    function logout() {
      fetch('/api/auth/logout', { method: 'POST' })
        .then(function() { window.location.href = '/login'; });
    }
  </script>
</body>
</html>
