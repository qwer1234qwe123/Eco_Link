<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>작업자 관리 | EcoLink BinGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
  
  <style>
    :root { --accent: #2ea86a; }

    /* 상단 통계 */
    .worker-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }

    /* 툴바 */
    .worker-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .worker-search {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      flex: 1;
      max-width: 320px;
    }

    .worker-search input {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      width: 100%;
    }

    .worker-search input::placeholder { color: var(--text-muted); }
    .worker-search svg { color: var(--text-muted); flex-shrink: 0; }

    .btn-add {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn-add:hover { background: var(--green-light); }

    /* 테이블 */
    .worker-table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .worker-table {
      width: 100%;
      border-collapse: collapse;
    }

    .worker-table th {
      text-align: left;
      padding: 12px 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    .worker-table td {
      padding: 14px 20px;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      vertical-align: middle;
    }

    .worker-table tr:last-child td { border-bottom: none; }
    .worker-table tr:hover td { background: rgba(255,255,255,0.02); }

    .worker-id {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .worker-name { font-weight: 600; color: var(--text); }
    .worker-username { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    .grade-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 600;
    }

    .grade-admin { background: rgba(59,130,246,0.15); color: #3b82f6; }
    .grade-worker { background: rgba(46,168,106,0.15); color: #2ea86a; }

    .vehicle-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-muted);
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .btn-edit, .btn-delete {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      font-family: 'Noto Sans KR', sans-serif;
      transition: background 0.2s;
    }

    .btn-edit {
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
    }
    .btn-edit:hover { background: rgba(255,255,255,0.1); color: var(--text); }

    .btn-delete {
      background: rgba(239,68,68,0.1);
      color: #ef4444;
    }
    .btn-delete:hover { background: rgba(239,68,68,0.2); }

    /* 모달 */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .modal-overlay.open { display: flex; }

    .modal {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 460px;
      margin: 20px;
      animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title { font-size: 16px; font-weight: 700; }

    .btn-modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .btn-modal-close:hover { color: var(--text); }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .form-input, .form-select {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    .form-input:focus, .form-select:focus { border-color: var(--accent); }
    .form-select option { background: #1c2330; }

    .form-input::placeholder { color: var(--text-dim); }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-cancel {
      padding: 9px 20px;
      background: rgba(255,255,255,0.06);
      color: var(--text-muted);
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .btn-cancel:hover { background: rgba(255,255,255,0.1); }

    .btn-submit {
      padding: 9px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--green-light); }

    /* 빈 상태 */
    .worker-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* 삭제 확인 모달 */
    .delete-modal-body {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 8px;
    }
    .delete-target {
      font-weight: 700;
      color: var(--text);
    }

    .btn-submit-delete {
      padding: 9px 20px;
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: background 0.2s;
    }
    .btn-submit-delete:hover { background: #dc2626; }

    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .filter-tab {
      padding: 6px 16px; border-radius: 100px; font-size: 12px;
      font-weight: 500; cursor: pointer; border: 1px solid var(--border);
      background: transparent; color: var(--text-muted); transition: all 0.2s;
      font-family: 'Noto Sans KR', sans-serif;
    }
    .filter-tab:hover { border-color: var(--accent); color: var(--text); }
    .filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    @media (max-width: 768px) {
      .worker-stats { grid-template-columns: repeat(2, 1fr); }
      .worker-toolbar { flex-direction: column; align-items: stretch; }
      .worker-search { max-width: 100%; }
      #worker-table-wrap { overflow-x: auto; }
      .worker-table { min-width: 560px; }
    }
  </style>
</head>
<body>
  <script>
    // ── 권한 체크 (페이지 로드 즉시) ──
    (function() {
      var page = window.location.pathname;
      var restricted = ['/worker', '/trashcan'];

      fetch('/bingo/api/auth/me', { credentials: 'include' })
        .then(function(res) {
          if (!res.ok) {
            window.location.replace('/bingo/login');
            return null;
          }
          return res.json();
        })
        .then(function(user) {
          if (!user) return;

          // grade 5가 제한 페이지 직접 접근 시 차단
          if (user.grade === 5 && restricted.includes(page)) {
            alert('접근 권한이 없습니다.');
            window.location.replace('/bingo/dashboard');
            return;
          }

          // 사용자 정보 표시
          var logo = document.querySelector('.sidebar-logo small');
          if (logo) {
            logo.textContent = user.username + ' (' + (user.grade === 1 ? '관리자' : '작업자') + ')';
          }

          // 로그아웃 버튼 표시
          var logoutBtn = document.getElementById('logout-btn');
          if (logoutBtn) logoutBtn.style.display = 'block';

          // grade 5: 제한 메뉴 클릭 시 알럿만
          if (user.grade === 5) {
            document.querySelectorAll('a[href="/bingo/worker"], a[href="/bingo/trashcan"]').forEach(function(el) {
              el.addEventListener('click', function(e) {
                e.preventDefault();
                alert('접근 권한이 없습니다.');
              });
            });
          }
        })
        .catch(function() {
          window.location.replace('/bingo/login');
        });
    })();
  </script>

  <aside>
    <div class="sidebar-logo">
      <h1>Bin<span>Go</span></h1>
      <small>by EcoLink — 관리자 대시보드</small>
    </div>
    <button class="dash-hamburger" id="dashHamburger" aria-label="메뉴" style="display:none">
      <span></span><span></span><span></span>
    </button>
    <nav class="side-nav">
      <div class="nav-group-label">모니터링</div>
      <a class="nav-item" href="/bingo/dashboard"><span class="icon"><i data-lucide="layout-dashboard"></i></span> 대시보드</a>
      <a class="nav-item" href="/bingo/trashcan"><span class="icon"><i data-lucide="trash-2"></i></span> 쓰레기통 목록</a>
      <a class="nav-item" href="/bingo/sensor-log"><span class="icon"><i data-lucide="radio"></i></span> 센서 로그</a>
      <div class="nav-group-label">AI / 예측</div>
      <a class="nav-item" href="/bingo/prediction"><span class="icon"><i data-lucide="bot"></i></span> 예측 결과</a>
      <a class="nav-item" href="/bingo/trend"><span class="icon"><i data-lucide="trending-up"></i></span> 적재율 추이</a>
      <div class="nav-group-label">수거 관리</div>
      <a class="nav-item" href="/bingo/route"><span class="icon"><i data-lucide="map"></i></span> 수거 경로</a>
      <a class="nav-item" href="/bingo/collection-history"><span class="icon"><i data-lucide="clipboard-list"></i></span> 수거 기록</a>
      <a class="nav-item active" href="/bingo/worker"><span class="icon"><i data-lucide="hard-hat"></i></span> 작업자 관리</a>
    </nav>
    <div class="sidebar-footer">
      <a href="/bingo/">← 소개 페이지로</a>
      <a id="logout-btn" href="#" onclick="logout()" style="display:none;margin-top:8px;color:#ef4444;font-size:13px;text-decoration:none;">로그아웃</a>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="topbar-left">
        <h2>작업자 관리</h2>
        <p>수거 작업자 계정 및 차량 정보 관리</p>
      </div>
      <div class="topbar-right">
        <span class="time" id="clock">--:--:--</span>
      </div>
    </div>

    <div class="content">

      <!-- 통계 카드 -->
      <div class="worker-stats">
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">전체 사용자</span>
            <span class="stat-card-icon"><i data-lucide="users"></i></span>
          </div>
          <div class="stat-card-value v-green" id="stat-total">—</div>
          <div class="stat-card-sub">등록된 계정</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">관리자</span>
            <span class="stat-card-icon"><i data-lucide="shield"></i></span>
          </div>
          <div class="stat-card-value v-blue" id="stat-admin">—</div>
          <div class="stat-card-sub">grade 1</div>
        </div>
        <div class="stat-card">
          <div class="stat-card-header">
            <span class="stat-card-label">작업자</span>
            <span class="stat-card-icon"><i data-lucide="hard-hat"></i></span>
          </div>
          <div class="stat-card-value v-green" id="stat-worker">—</div>
          <div class="stat-card-sub">grade 5</div>
        </div>
      </div>

      <!-- 툴바 -->
      <div class="worker-toolbar">
        <div class="worker-search">
          <i data-lucide="search" style="width:14px;height:14px"></i>
          <input type="text" id="search-input" placeholder="이름 또는 아이디 검색..." oninput="filterWorkers()">
        </div>
        <div class="filter-tabs">
          <button class="filter-tab active" onclick="setFilter('all', this)">전체</button>
          <button class="filter-tab" onclick="setFilter('admin', this)">관리자</button>
          <button class="filter-tab" onclick="setFilter('worker', this)">작업자</button>
        </div>
        <button class="btn-add" onclick="openAddModal()">
          <i data-lucide="user-plus" style="width:14px;height:14px"></i>
          작업자 추가
        </button>
      </div>

      <!-- 테이블 -->
      <div class="worker-table-wrap" id="worker-table-wrap">
        <div class="loading"><div class="spinner"></div> 불러오는 중...</div>
      </div>

    </div>
  </main>

  <!-- 추가/수정 모달 -->
  <div class="modal-overlay" id="formModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">작업자 추가</div>
        <button class="btn-modal-close" onclick="closeModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="form-group">
        <label class="form-label">아이디 (username)</label>
        <input type="text" class="form-input" id="f-username" placeholder="로그인 아이디 입력">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input type="password" class="form-input" id="f-password" placeholder="비밀번호 입력">
      </div>
      <div class="form-group">
        <label class="form-label">등급</label>
        <select class="form-select" id="f-grade">
          <option value="5">작업자 (grade 5)</option>
          <option value="1">관리자 (grade 1)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">차량 번호 (선택)</label>
        <input type="text" class="form-input" id="f-vehicle" placeholder="예: 12가3456">
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">취소</button>
        <button class="btn-submit" id="modal-submit-btn" onclick="submitForm()">추가</button>
      </div>
    </div>
  </div>

  <!-- 삭제 확인 모달 -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">작업자 삭제</div>
        <button class="btn-modal-close" onclick="closeDeleteModal()">
          <i data-lucide="x"></i>
        </button>
      </div>
      <div class="delete-modal-body">
        <span class="delete-target" id="delete-target-name"></span> 계정을 삭제하시겠습니까?<br>
        삭제 후 복구가 불가능합니다.
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeDeleteModal()">취소</button>
        <button class="btn-submit-delete" onclick="confirmDelete()">삭제</button>
      </div>
    </div>
  </div>

  <script>
    // ── 시계 ──
    function updateClock() {
      document.getElementById('clock').textContent =
        new Date().toLocaleTimeString('ko-KR', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ── 상태 ──
    let allWorkers = [];
    let currentFilter = 'all';
    let editingId = null;
    let deletingId = null;

    // ── 등급 표시 ──
    function gradeBadge(grade) {
      if (grade === 1) return `<span class="grade-badge grade-admin"><i data-lucide="shield" style="width:11px;height:11px"></i> 관리자</span>`;
      return `<span class="grade-badge grade-worker"><i data-lucide="hard-hat" style="width:11px;height:11px"></i> 작업자</span>`;
    }

    // ── 테이블 렌더링 ──
    function renderTable(data) {
      const wrap = document.getElementById('worker-table-wrap');
      if (!data || data.length === 0) {
        wrap.innerHTML = `<div class="worker-empty">등록된 작업자가 없습니다.</div>`;
        return;
      }
      wrap.innerHTML = `
        <table class="worker-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>아이디</th>
              <th>등급</th>
              <th>차량 번호</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody>
            ${data.map(w => `
              <tr>
                <td><span class="worker-id">#${w.id}</span></td>
                <td><div class="worker-name">${w.username}</div></td>
                <td>${gradeBadge(w.grade)}</td>
                <td><span class="vehicle-num">${w.vehicleNumber || '—'}</span></td>
                <td>
                  <div class="action-btns">
                    <button class="btn-edit" onclick="openEditModal(${w.id})">
                      <i data-lucide="pencil" style="width:12px;height:12px"></i> 수정
                    </button>
                    <button class="btn-delete" onclick="openDeleteModal(${w.id}, '${w.username}')">
                      <i data-lucide="trash-2" style="width:12px;height:12px"></i> 삭제
                    </button>
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
      lucide.createIcons();
    }

    // ── 필터 ──
    let searchText = '';
    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      applyFilter();
    }

    function filterWorkers() {
      searchText = document.getElementById('search-input').value.toLowerCase();
      applyFilter();
    }

    function applyFilter() {
      let filtered = allWorkers;
      if (currentFilter === 'admin') filtered = filtered.filter(w => w.grade === 1);
      if (currentFilter === 'worker') filtered = filtered.filter(w => w.grade !== 1);
      if (searchText) filtered = filtered.filter(w =>
        w.username.toLowerCase().includes(searchText)
      );
      renderTable(filtered);
    }

    // ── 데이터 로드 ──
    async function loadWorkers() {
      try {
        const res = await fetch('/bingo/api/users', { credentials: 'include' });
        if (!res.ok) throw new Error('API 오류');
        allWorkers = await res.json();
      } catch {
        // 백엔드 미완성 시 임시 데이터
        allWorkers = [
          { id: 1, username: 'admin', grade: 1, vehicleNumber: null },
          { id: 6, username: 'worker1', grade: 5, vehicleNumber: '12가3456' },
        ];
      }

      // 통계 업데이트
      document.getElementById('stat-total').textContent = allWorkers.length;
      document.getElementById('stat-admin').textContent = allWorkers.filter(w => w.grade === 1).length;
      document.getElementById('stat-worker').textContent = allWorkers.filter(w => w.grade !== 1).length;

      applyFilter();
    }

    // ── 추가 모달 ──
    function openAddModal() {
      editingId = null;
      document.getElementById('modal-title').textContent = '작업자 추가';
      document.getElementById('modal-submit-btn').textContent = '추가';
      document.getElementById('f-username').value = '';
      document.getElementById('f-password').value = '';
      document.getElementById('f-grade').value = '5';
      document.getElementById('f-vehicle').value = '';
      document.getElementById('f-password').required = true;
      document.getElementById('formModal').classList.add('open');
    }

    // ── 수정 모달 ──
    function openEditModal(id) {
      const w = allWorkers.find(w => w.id === id);
      if (!w) return;
      editingId = id;
      document.getElementById('modal-title').textContent = '작업자 수정';
      document.getElementById('modal-submit-btn').textContent = '저장';
      document.getElementById('f-username').value = w.username;
      document.getElementById('f-password').value = '';
      document.getElementById('f-grade').value = w.grade;
      document.getElementById('f-vehicle').value = w.vehicleNumber || '';
      document.getElementById('formModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('formModal').classList.remove('open');
    }

    // ── 추가/수정 제출 ──
    async function submitForm() {
      const username = document.getElementById('f-username').value.trim();
      const password = document.getElementById('f-password').value.trim();
      const grade = parseInt(document.getElementById('f-grade').value);
      const vehicleNumber = document.getElementById('f-vehicle').value.trim() || null;

      if (!username) { alert('아이디를 입력해주세요.'); return; }
      if (!editingId && !password) { alert('비밀번호를 입력해주세요.'); return; }

      const body = { username, grade, vehicleNumber };
      if (password) body.password = password;

      try {
        const url = editingId ? `/bingo/api/users/${editingId}` : '/bingo/api/users';
        const method = editingId ? 'PUT' : 'POST';
        const res = await fetch(url, { credentials: 'include', credentials: 'include',
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('저장 실패');
        closeModal();
        loadWorkers();
      } catch (e) {
        alert('저장에 실패했습니다: ' + e.message);
      }
    }

    // ── 삭제 모달 ──
    function openDeleteModal(id, username) {
      deletingId = id;
      document.getElementById('delete-target-name').textContent = username;
      document.getElementById('deleteModal').classList.add('open');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('open');
      deletingId = null;
    }

    async function confirmDelete() {
      if (!deletingId) return;
      try {
        const res = await fetch(`/bingo/api/users/${deletingId}`, { method: 'DELETE', credentials: 'include' });
        if (!res.ok) throw new Error('삭제 실패');
        closeDeleteModal();
        loadWorkers();
      } catch (e) {
        alert('삭제에 실패했습니다: ' + e.message);
      }
    }

    // ── 모바일 햄버거 ──
    const dashHamburger = document.getElementById('dashHamburger');
    const sideNav = document.querySelector('nav.side-nav');
    function initMobileNav() {
      if (window.innerWidth <= 768) { dashHamburger.style.display = 'flex'; }
      else { dashHamburger.style.display = 'none'; sideNav.classList.remove('open'); dashHamburger.classList.remove('open'); }
    }
    dashHamburger.addEventListener('click', () => { dashHamburger.classList.toggle('open'); sideNav.classList.toggle('open'); });
    initMobileNav();
    window.addEventListener('resize', initMobileNav);

    loadWorkers();
  </script>
  <script>
    (function() {
      var script = document.createElement('script');
      script.src = 'https://unpkg.com/lucide@latest/dist/umd/lucide.min.js';
      script.onload = function() { lucide.createIcons(); };
      document.head.appendChild(script);
    })();
  </script>
  <script>
    function logout() {
      fetch('/bingo/api/auth/logout', { method: 'POST', credentials: 'include' })
        .then(function() { window.location.href = '/bingo/login'; });
    }
  </script>
</body>
</html>
